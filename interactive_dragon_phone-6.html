<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Interactive Dragon 🐉</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;touch-action:none}
canvas{display:block;width:100%;height:100%}
#tip{position:fixed;top:14px;left:50%;transform:translateX(-50%);
color:#aaa;font:14px Arial;pointer-events:none;opacity:.8}
</style>
</head>
<body>
<div id="tip">Drag your finger 🐉</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let W,H,dpr,px=W/2,py=H/2;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);px=W/2;py=H/2}
addEventListener("resize",resize);resize();

const N=32, p=[];
for(let i=0;i<N;i++)p.push({x:W/2-i*10,y:H/2,px:W/2-i*10,py:H/2});
let tx=px,ty=py,touch=false;

function pointer(e){
 let q=e.touches?e.touches[0]:e;
 tx=q.clientX;ty=q.clientY;touch=true;
}
addEventListener("pointermove",pointer);
addEventListener("touchmove",pointer,{passive:false});
addEventListener("pointerdown",pointer);
addEventListener("touchstart",pointer,{passive:false});
addEventListener("pointerup",()=>touch=false);
addEventListener("touchend",()=>touch=false);

function seg(a,b,len){
 let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 a.x=b.x-dx/d*len;a.y=b.y-dy/d*len;
}
function limb(a,ang,l1,l2){
 let k={x:a.x+Math.cos(ang)*l1,y:a.y+Math.sin(ang)*l1};
 let e={x:k.x+Math.cos(ang+.25)*l2,y:k.y+Math.sin(ang+.25)*l2};
 x.moveTo(a.x,a.y);x.lineTo(k.x,k.y);x.lineTo(e.x,e.y);
 x.moveTo(e.x,e.y);x.lineTo(e.x+Math.cos(ang+.9)*7,e.y+Math.sin(ang+.9)*7);
}
function draw(){
 requestAnimationFrame(draw);
 x.fillStyle="rgba(5,5,9,.25)";x.fillRect(0,0,W,H);

 // head follows finger
 if(!touch){tx=W/2+Math.sin(Date.now()/900)*100;ty=H/2+Math.cos(Date.now()/1100)*70}
 p[0].x+=(tx-p[0].x)*.18;p[0].y+=(ty-p[0].y)*.18;
 for(let i=1;i<N;i++){
   p[i].x+=(p[i].px-p[i].x)*.18;
   p[i].y+=(p[i].py-p[i].y)*.18;
   seg(p[i],p[i-1],10.5);
 }
 // spine
 x.lineCap="round";x.lineJoin="round";
 x.beginPath();
 for(let i=0;i<N;i++){if(i)x.lineTo(p[i].x,p[i].y);else x.moveTo(p[i].x,p[i].y)}
 x.strokeStyle="rgba(180,190,200,.8)";x.lineWidth=2;x.stroke();

 // ribs / scales
 for(let i=3;i<N-3;i+=2){
   let a=p[i-1],b=p[i+1],ang=Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2;
   let s=18*(1-i/N*.55);
   x.beginPath();x.moveTo(p[i].x,p[i].y);
   x.quadraticCurveTo(p[i].x+Math.cos(ang)*s,p[i].y+Math.sin(ang)*s,
                      p[i].x+Math.cos(ang)*s*.7+Math.cos(ang+Math.PI)*5,
                      p[i].y+Math.sin(ang)*s*.7+Math.sin(ang+Math.PI)*5);
   x.strokeStyle="rgba(150,160,170,.65)";x.lineWidth=1;x.stroke();
 }

 // legs
 x.beginPath();
 for(let i of [7,12,17,22]){
   let a=p[i],b=p[i+1],ang=Math.atan2(b.y-a.y,b.x-a.x);
   limb(a,ang+1.9,24,18);
   limb(a,ang-1.9,24,18);
 }
 x.strokeStyle="rgba(170,180,190,.75)";x.lineWidth=1.5;x.stroke();

 // head
 let a=p[0],b=p[2],ang=Math.atan2(a.y-b.y,a.x-b.x);
 x.save();x.translate(a.x,a.y);x.rotate(ang);
 x.beginPath();x.moveTo(18,0);x.lineTo(3,-10);x.lineTo(-13,-8);x.lineTo(-9,0);x.lineTo(-13,8);x.lineTo(3,10);x.closePath();
 x.strokeStyle="#d4d8dc";x.lineWidth=2;x.stroke();
 // horns
 x.beginPath();x.moveTo(-4,-7);x.lineTo(-10,-22);x.moveTo(3,-8);x.lineTo(5,-23);x.stroke();
 // eye
 x.fillStyle="#fff";x.beginPath();x.arc(8,-4,2,0,7);x.fill();
 x.restore();

 // tail tip
 let t=p[N-1];x.beginPath();x.arc(t.x,t.y,2,0,7);x.fillStyle="#ddd";x.fill();

 p.forEach(q=>{q.px=q.x;q.py=q.y});
}
draw();
</script>
</body>
</html>
